[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbs"
version = "0.1.0"
description = "Reimplementação do Biased Box Sampling (BBS) e do FD-ASE"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ana Paula Appel" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
llm = [
    "sentence-transformers>=3.0",
    "datasets>=2.19",
]
qml = [
    "qiskit>=1.2,<3",
    "qiskit-aer>=0.15",
    "qiskit-machine-learning>=0.8",
]
ibm = [
    "qiskit-ibm-runtime>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["pkdd/tests", "llm/tests", "d2-qubit-budget/tests"]
pythonpath = ["src", ".", "d2-qubit-budget"]
